[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=25.0",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
